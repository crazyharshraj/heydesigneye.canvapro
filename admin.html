<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hey Design Eye — Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#0a0a0f;color:#fff;font-family:Inter,system-ui,sans-serif}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:18px}
input,select{background:#11111a;border:1px solid rgba(255,255,255,.1);color:#fff;border-radius:10px;padding:11px 12px;outline:none}
input:focus,select:focus{border-color:#00c4cc}
th{font-size:11px;color:#9ca3af;text-transform:uppercase;letter-spacing:.08em;text-align:left;padding:13px}
td{padding:13px;border-top:1px solid rgba(255,255,255,.06);font-size:13px}
.badge{padding:4px 8px;border-radius:999px;font-size:10px;font-weight:700}
</style>
</head>
<body>
<div id="login" class="min-h-screen flex items-center justify-center p-6">
  <div class="card p-8 w-full max-w-sm">
    <p class="text-xs tracking-widest uppercase text-cyan-400 font-bold">Hey Design Eye</p>
    <h1 class="text-2xl font-bold mt-2 mb-6">Admin Login</h1>
    <form id="login-form" class="space-y-4">
      <input id="email" type="email" placeholder="Admin email" required class="w-full">
      <input id="password" type="password" placeholder="Password" required class="w-full">
      <button class="w-full rounded-xl py-3 font-bold bg-cyan-400 text-black">Login</button>
      <p id="login-error" class="text-red-400 text-xs"></p>
    </form>
  </div>
</div>

<div id="app" class="hidden min-h-screen">
  <header class="border-b border-white/10 px-6 py-5">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div><p class="text-xs tracking-widest uppercase text-cyan-400 font-bold">Hey Design Eye</p><h1 class="text-xl font-bold">Subscription Dashboard</h1></div>
      <button id="logout" class="text-sm text-gray-400 hover:text-white">Logout</button>
    </div>
  </header>
  <main class="max-w-7xl mx-auto p-6 space-y-6">
    <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="card p-5"><p class="text-xs text-gray-400">Total Users</p><p id="total" class="text-3xl font-bold mt-2">—</p></div>
      <div class="card p-5"><p class="text-xs text-gray-400">Active</p><p id="active" class="text-3xl font-bold mt-2">—</p></div>
      <div class="card p-5"><p class="text-xs text-gray-400">Expiring Soon</p><p id="soon" class="text-3xl font-bold mt-2">—</p></div>
      <div class="card p-5"><p class="text-xs text-gray-400">Expired</p><p id="expired" class="text-3xl font-bold mt-2">—</p></div>
    </div>

    <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="card p-4"><span class="text-gray-400 text-xs">1 Month</span><b id="p1" class="block text-xl mt-1">0</b></div>
      <div class="card p-4"><span class="text-gray-400 text-xs">3 Months</span><b id="p3" class="block text-xl mt-1">0</b></div>
      <div class="card p-4"><span class="text-gray-400 text-xs">6 Months</span><b id="p6" class="block text-xl mt-1">0</b></div>
      <div class="card p-4"><span class="text-gray-400 text-xs">1 Year</span><b id="p12" class="block text-xl mt-1">0</b></div>
    </div>

    <div class="card p-4">
      <div class="flex flex-col md:flex-row gap-3 justify-between mb-4">
        <input id="search" class="w-full md:w-80" placeholder="Search name, email or phone">
        <select id="filter" class="w-full md:w-48">
          <option>All Plans</option><option>1 Month</option><option>3 Months</option><option>6 Months</option><option>1 Year</option>
        </select>
        <button id="refresh" class="rounded-xl border border-white/10 px-4 py-2 text-sm">Refresh</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Plan</th><th>Registered</th><th>Expiry</th><th>Status</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p id="empty" class="hidden text-center text-gray-500 py-10">No subscriptions found.</p>
    </div>
  </main>
</div>

<script>
const APP_CONFIG={
  SUPABASE_URL:"YOUR_SUPABASE_URL",
  SUPABASE_ANON_KEY:"YOUR_SUPABASE_ANON_KEY"
};
const sb=window.supabase.createClient(APP_CONFIG.SUPABASE_URL,APP_CONFIG.SUPABASE_ANON_KEY);
let allRows=[];

function dateText(v){return v?new Intl.DateTimeFormat("en-IN",{day:"2-digit",month:"short",year:"numeric"}).format(new Date(v+"T00:00:00")):"—"}
function computedStatus(row){
  if(row.status==="Renewal Requested") return "Renewal Requested";
  const today=new Date(); today.setHours(0,0,0,0);
  const exp=new Date(row.expiry_date+"T00:00:00");
  if(exp<today) return "Expired";
  const diff=Math.ceil((exp-today)/86400000);
  return diff<=30?"Expiring Soon":"Active";
}
function render(){
  const q=document.getElementById("search").value.toLowerCase();
  const plan=document.getElementById("filter").value;
  const rows=allRows.filter(r=>
    (!q||[r.name,r.email,r.phone].join(" ").toLowerCase().includes(q)) &&
    (plan==="All Plans"||r.plan===plan)
  );
  document.getElementById("rows").innerHTML=rows.map(r=>{
    const s=computedStatus(r);
    const cls=s==="Active"?"bg-cyan-400/10 text-cyan-300":s==="Expired"?"bg-red-400/10 text-red-300":"bg-yellow-400/10 text-yellow-300";
    return `<tr><td class="font-semibold">${escapeHtml(r.name)}</td><td>${escapeHtml(r.email)}</td><td>${escapeHtml(r.phone)}</td><td>${escapeHtml(r.plan)}</td><td>${dateText(r.start_date)}</td><td>${dateText(r.expiry_date)}</td><td><span class="badge ${cls}">${s}</span></td></tr>`
  }).join("");
  document.getElementById("empty").classList.toggle("hidden",rows.length!==0);
}
function escapeHtml(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function load(){
  const {data,error}=await sb.from("subscriptions").select("*").order("created_at",{ascending:false});
  if(error){alert(error.message);return}
  allRows=data||[];
  document.getElementById("total").textContent=allRows.length;
  document.getElementById("active").textContent=allRows.filter(r=>computedStatus(r)==="Active").length;
  document.getElementById("soon").textContent=allRows.filter(r=>computedStatus(r)==="Expiring Soon").length;
  document.getElementById("expired").textContent=allRows.filter(r=>computedStatus(r)==="Expired").length;
  document.getElementById("p1").textContent=allRows.filter(r=>r.plan==="1 Month").length;
  document.getElementById("p3").textContent=allRows.filter(r=>r.plan==="3 Months").length;
  document.getElementById("p6").textContent=allRows.filter(r=>r.plan==="6 Months").length;
  document.getElementById("p12").textContent=allRows.filter(r=>r.plan==="1 Year").length;
  render();
}
async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(session){document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");load()}
}
document.getElementById("login-form").onsubmit=async e=>{
  e.preventDefault();
  const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});
  document.getElementById("login-error").textContent=error?error.message:"";
  if(!error){login.classList.add("hidden");app.classList.remove("hidden");load()}
};
document.getElementById("logout").onclick=async()=>{await sb.auth.signOut();location.reload()};
document.getElementById("search").oninput=render;
document.getElementById("filter").onchange=render;
document.getElementById("refresh").onclick=load;
init();
</script>
</body>
</html>
